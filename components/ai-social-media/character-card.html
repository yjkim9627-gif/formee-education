<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Character Card — Shared Component</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="../demo-nav.css" />
<link rel="stylesheet" href="filter-chip.css" />
<link rel="stylesheet" href="character-card.css" />
<style>
  body { margin: 0; background: var(--color-neutral-50); font-family: var(--font-family-text); color: var(--color-neutral-900); }
  .demo-main { padding: var(--spacing-4xl); }
  h1 { font-size: var(--font-size-display-xs); line-height: var(--line-height-display-xs); font-weight: var(--font-weight-display-xs); margin: 0 0 var(--spacing-3xl); }
</style>
</head>
<body>
<div class="demo-shell">
  <nav class="demo-sidebar">
    <div class="demo-sidebar-group">
      <div class="demo-sidebar-label">AI Social Media</div>
      <a href="nav.html">Nav / Navigation</a>
      <a href="topbar-stepper.html">Topbar + Stepper</a>
      <a href="chat-panel.html">Chat Panel</a>
      <a href="character-card.html" class="active">Character Card</a>
      <a href="switch.html">Controls / Switch</a>
      <a href="prompt-box.html">AI Prompt Box</a>
      <a href="filter-chip.html">Controls / Filter / Toggle</a>
      <a href="setting-chip.html">Setting Chip</a>
    </div>
    <div class="demo-sidebar-group">
      <div class="demo-sidebar-label">Shared</div>
      <a href="../shared/button.html">Button</a>
      <a href="../shared/modal-confirm.html">Modal / Confirm</a>
      <a href="../shared/modal-form.html">Modal / Form</a>
      <a href="../shared/modal-success.html">Modal / Success</a>
    </div>
  </nav>
  <main class="demo-main">
  <h1>Character Card</h1>

  <div class="char-panel" style="max-width:640px;">
    <div class="char-filters">
      <div class="filter-chip active">Favorites ★</div>
      <div class="filter-chip">Age <span class="chevron">▾</span></div>
    </div>
    <div class="char-grid">
      <div class="char-card new"><div class="thumb">+</div><div class="name">Create New</div></div>
      <div class="char-card selected"><div class="thumb"></div><div class="name">Elena</div><div class="char-check">✓</div></div>
      <div class="char-card"><div class="thumb"></div><div class="name">Milo</div></div>
      <div class="char-card disabled"><div class="thumb"></div><div class="name">Priya (disabled)</div></div>
    </div>
  </div>
  </main>
</div>
</body>
</html>
