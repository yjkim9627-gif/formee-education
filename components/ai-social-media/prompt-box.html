<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AI Prompt Box — Shared Component</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="prompt-box.css" />
<style>
  body { margin: 0; padding: var(--spacing-4xl); background: var(--color-neutral-50); font-family: var(--font-family-text); color: var(--color-neutral-900); max-width: 720px; }
  h1 { font-size: var(--font-size-display-xs); line-height: var(--line-height-display-xs); font-weight: var(--font-weight-display-xs); margin: 0 0 var(--spacing-3xl); }
  section { margin-bottom: var(--spacing-3xl); }
  section h2 { font-size: var(--font-size-text-md); font-weight: var(--font-weight-semibold); color: var(--color-neutral-700); margin: 0 0 var(--spacing-lg); }
</style>
</head>
<body>
  <h1>AI Prompt Box</h1>

  <section>
    <h2>Default</h2>
    <div class="prompt-box">
      <div class="prompt-top">
        <textarea class="prompt-summary">밝고 에너지 넘치는 UGC 스타일 영상 — 립틴트를 손등에 발라보고, 입술에 바르는 장면.</textarea>
      </div>
      <div class="prompt-bottom">
        <div class="prompt-chips">
          <div class="prompt-chip"><div class="ic"></div>9:16</div>
          <div class="prompt-chip-wrap">
            <div class="prompt-chip clickable">
              <div class="ic"></div><span>8s</span><span class="chevron">▾</span>
            </div>
            <div class="chip-popover">
              <div class="chip-popover-label">Duration</div>
              <div class="chip-option selected"><span>8 seconds</span><span class="check">✓</span></div>
              <div class="chip-option"><span>16 seconds</span><span class="check">✓</span></div>
            </div>
          </div>
        </div>
        <div class="refine-btn">↑</div>
      </div>
    </div>
  </section>

  <section>
    <h2>Refine 버튼 disabled</h2>
    <div class="prompt-box">
      <div class="prompt-top"><textarea class="prompt-summary" placeholder="아이디어를 설명해주세요"></textarea></div>
      <div class="prompt-bottom">
        <div class="prompt-chips"><div class="prompt-chip"><div class="ic"></div>9:16</div></div>
        <button class="refine-btn" disabled>↑</button>
      </div>
    </div>
  </section>
</body>
</html>
