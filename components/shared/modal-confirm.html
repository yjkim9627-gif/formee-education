<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Modal / Confirm — Shared Component</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="button.css" />
<link rel="stylesheet" href="modal.css" />
<style>
  body {
    margin: 0;
    padding: var(--spacing-4xl);
    background: var(--color-neutral-50);
    font-family: var(--font-family-text);
    color: var(--color-neutral-900);
  }

  h1 {
    font-size: var(--font-size-display-xs);
    line-height: var(--line-height-display-xs);
    font-weight: var(--font-weight-display-xs);
    margin: 0 0 var(--spacing-3xl);
  }

  section {
    margin-bottom: var(--spacing-4xl);
  }

  section h2 {
    font-size: var(--font-size-text-md);
    line-height: var(--line-height-text-md);
    font-weight: var(--font-weight-semibold);
    color: var(--color-neutral-700);
    margin: 0 0 var(--spacing-lg);
  }
</style>
</head>
<body>
  <h1>Modal / Confirm</h1>

  <section>
    <h2>질문 + 버튼 2개 (제목 없음, 파괴적 액션)</h2>
    <div class="preview-frame">
      <div class="modal-overlay">
        <div class="modal modal--confirm">
          <div class="modal__content">
            <p class="modal__body">정말 이 마일스톤을 삭제하시겠습니까? 삭제하면 되돌릴 수 없습니다.</p>
          </div>
          <div class="modal__footer">
            <button class="btn btn-secondary">취소</button>
            <button class="btn btn-danger">삭제</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>제목 + 서브텍스트 + 버튼 2개</h2>
    <div class="preview-frame">
      <div class="modal-overlay">
        <div class="modal modal--confirm">
          <button class="modal__close" aria-label="닫기">&times;</button>
          <div class="modal__content">
            <h3 class="modal__title">지금 이메일을 보낼까요?</h3>
            <p class="modal__body">제목: 컴플라이언스 업데이트</p>
          </div>
          <div class="modal__footer">
            <button class="btn btn-secondary">취소</button>
            <button class="btn btn-primary">보내기</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
